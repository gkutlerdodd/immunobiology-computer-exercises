project: 
  type: website

resources:
  - data/AugustoSI_allelefrequencies.csv
  
website: 
  page-navigation: true
  title: "Making sharable documents with Quarto" 
  site-url: "https://gkutlerdodd.github.io/immunobiology-computer-exercises" 
  repo-url: https://github.com/gkutlerdodd/immunobiology-computer-exercises
  
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "Theoretical Biology & Bioinformatics, Utrecht University"
    
  sidebar:
    logo: "images/openscapes_hex.png"
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://openscapes.org
        text: "Openscapes.org"
      - icon: github
        href: https://github.com/openscapes/quarto-website-tutorial
        text: "Quarto website tutorial"
      - icon: twitter
        href: https://twitter.com/openscapes
        text: "Openscapes Twitter"         

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Welcome
      - crossreactivity.qmd
      - learning-more.qmd

format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    toc: true


filters:
  - include-files.lua
  - quarto

  
